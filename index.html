<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f6f4">
<meta name="description" content="按日期保存英文总结，循环朗读复习。">
<title>每日听读</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=2">
<script src="app.js?v=2" defer></script>
</head>
<body>
<main class="shell">
  <header class="top">
    <div><h1>每日听读</h1><p>存下每天的英文总结，随时听一遍。</p></div>
    <button id="add" class="light"><span aria-hidden="true">＋</span> 添加文章</button>
  </header>

  <section class="player" aria-labelledby="player-title">
    <div class="player-inner">
      <p class="eyebrow">听力复习</p>
      <h2 id="player-title">按日期播放</h2>
      <p id="now" class="now" aria-live="polite"></p>
      <div class="transport" aria-label="播放控制">
        <button id="previous" class="skip" aria-label="上一篇" disabled>Ⅰ◀</button>
        <button id="toggle" class="play" disabled><span id="play-symbol" aria-hidden="true">▶</span> <span id="play-label">开始复习</span></button>
        <button id="next" class="skip" aria-label="下一篇" disabled>▶Ⅰ</button>
        <p id="progress" class="play-progress" aria-live="polite" hidden></p>
      </div>
      <div class="settings">
        <label for="loop">播放范围
          <select id="loop"><option value="all">按日期</option><option value="one">只听单篇</option></select>
        </label>
        <label for="repeat-count">次数
          <select id="repeat-count">
            <option value="1">播 1 次</option><option value="2">循环 2 次</option>
            <option value="3">循环 3 次</option><option value="5">循环 5 次</option>
            <option value="10">循环 10 次</option><option value="infinite" selected>一直循环</option>
          </select>
        </label>
        <label for="speed">语速
          <select id="speed"><option value="1">1×</option><option value="0.85">0.85×</option><option value="0.7">0.7×</option></select>
        </label>
      </div>
      <details class="audio-details">
        <summary>语音和停顿</summary>
        <div class="settings">
          <label for="voice">口音
            <select id="voice"><option value="en-US">美式英语</option><option value="en-GB">英式英语</option></select>
          </label>
          <label for="gap">篇间停顿
            <select id="gap"><option value="0">无停顿</option><option value="2">2 秒</option><option value="5">5 秒</option></select>
          </label>
        </div>
        <label id="awake-option" class="awake-option" hidden><input id="awake" type="checkbox"> 播放时保持屏幕常亮</label>
        <p class="audio-note">浏览器锁屏后可能暂停朗读。</p>
      </details>
      <p id="play-error" class="play-error" role="status" hidden></p>
    </div>
    <div class="waves" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </section>

  <section class="library" aria-labelledby="library-title">
    <header><h2 id="library-title">文章库</h2><p id="count"></p></header>
    <div id="empty" class="empty"><strong>还没有文章</strong><p>把今天的英文总结粘贴进来。</p></div>
    <ul id="articles"></ul>
    <div class="library-tools">
      <button id="export" type="button" class="light">导出备份</button>
      <button id="import" type="button" class="light">导入备份</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
    </div>
    <p class="local">文章只保存在当前浏览器。换手机或换网址前，可以先导出备份。</p>
    <p id="storage-message" role="status" hidden></p>
  </section>
</main>

<dialog id="editor" aria-labelledby="edit-title">
  <form id="form">
    <h2 id="edit-title">添加文章</h2>
    <div class="editor-fields">
      <label for="date">日期<input id="date" type="date" required></label>
      <label for="article-title">标题（选填）<input id="article-title" type="text" maxlength="100" placeholder="留空时用正文首行"></label>
    </div>
    <label for="body">英文正文</label>
    <textarea id="body" lang="en" placeholder="粘贴你的英文总结…" required></textarea>
    <p id="edit-error" role="status" hidden></p>
    <div class="actions">
      <button id="remove" type="button" class="danger" hidden>删除</button>
      <button id="cancel" type="button" class="light">取消</button>
      <button type="submit" class="save">保存文章</button>
    </div>
  </form>
</dialog>
</body>
</html>
